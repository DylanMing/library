# 构建 MkDocs 站点并部署到 GitHub Pages
# 触发：推送到 main 分支，或手动运行
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许在 GitHub Actions 页面手动触发

# 部署 GitHub Pages 所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，排队而非取消（避免部署冲突）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: 安装 zensical
        run: pip install zensical
      - name: 构建站点
        working-directory: mkdocs  # mkdocs.yml 所在目录
        run: zensical build -f mkdocs.yml
      - name: 上传 Pages 构件
        uses: actions/upload-pages-artifact@v3
        with:
          path: mkdocs/site  # 构建产物路径（相对仓库根目录）

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
